# Minimal alternate lock screen for Super + Alt + L.
general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    # Add a local image here if desired: path = /path/to/image.png
    color = rgba(8, 8, 12, 1.0)
}

input-field {
    monitor =
    size = 1, 1
    outline_thickness = 0
    outer_color = rgba(0, 0, 0, 0.0)
    inner_color = rgba(0, 0, 0, 0.0)
    font_color = rgba(0, 0, 0, 0.0)
    fade_on_empty = false
    hide_input = true
    check_color = rgba(0, 0, 0, 0.0)
    fail_color = rgba(0, 0, 0, 0.0)
    position = 0, 0
    halign = center
    valign = center
}
