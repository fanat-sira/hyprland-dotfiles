# The Shipwreck — Claude-Joseph Vernet, 1772
# Two typographic masses: clock/auth upper-left, artwork caption lower-right.

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = @DOTFILES_HOME@/Pictures/Wallpapers/the_shipwreck.jpeg
    color = rgba(10, 13, 15, 1.0)
    blur_passes = 0
    zindex = -1
}

# Soft screen-edge falloff, matching the desktop shell.
image {
    monitor =
    path = @DOTFILES_HOME@/.config/hypr/assets/lockscreen-edge-shadow.png
    size = 1440
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# --- Upper-left: functional block ------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "<span font_features='lnum=1,pnum=1'>$(date '+%H:%M')</span>"
    color = rgba(e8e3d8ff)
    font_size = 84
    font_family = Cormorant Garamond
    position = 5%, -5%
    halign = left
    valign = top
    zindex = 20
}

label {
    monitor =
    text = cmd[update:60000] echo "<span font_features='lnum=1,pnum=1'>$(LC_TIME=C date '+%A, %-d %B')</span>"
    color = rgba(e8e3d8d1)
    font_size = 33
    font_family = Cormorant Garamond
    position = 5%, -15%
    halign = left
    valign = top
    zindex = 20
}

# Visually absent when empty. Only the password dots appear below the date.
input-field {
    monitor =
    size = 220, 24
    outline_thickness = 0
    dots_size = 0.42
    dots_spacing = 0.26
    dots_center = false
    dots_rounding = -1
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(e8e3d8ff)
    check_color = rgba(e8e3d8ff)
    fail_color = rgba(d1844fff)
    fade_on_empty = true
    fade_timeout = 0
    placeholder_text = <i></i>
    hide_input = false
    rounding = 0
    position = 5%, -19%
    halign = left
    valign = top
    zindex = 20
}

